<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Agent 管理面板</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">H</div>
      <div class="brand-text">
        <h1>Hermes Agent</h1>
        <span class="subtitle">自主进化型 AI Agent · 管理面板</span>
      </div>
    </div>
    <div class="status">
      <span id="agentStatus" class="badge online">● ONLINE</span>
      <span id="uptime" class="uptime">运行中 0s</span>
      <span id="clock" class="clock"></span>
      <button id="refreshBtn" class="btn">刷新</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="dashboard">仪表盘</button>
    <button class="tab" data-tab="ops">系统运维</button>
    <button class="tab" data-tab="settings">设置</button>
  </nav>

  <main>
    <!-- ===== 仪表盘 ===== -->
    <div id="view-dashboard" class="view">
      <section class="cards" id="overviewCards"></section>
      <section class="grid">
        <div class="panel tasks">
          <div class="panel-head">
            <h2>任务队列</h2>
            <button id="newTaskBtn" class="btn primary">+ 新建任务</button>
          </div>
          <div class="panel-body" id="taskList"></div>
        </div>

        <div class="panel skills">
          <div class="panel-head"><h2>技能</h2></div>
          <div class="panel-body" id="skillList"></div>
        </div>

        <div class="panel memory">
          <div class="panel-head"><h2>长期记忆</h2></div>
          <div class="panel-body" id="memoryList"></div>
        </div>

        <div class="panel metrics">
          <div class="panel-head"><h2>运行指标</h2><span class="hint">近 1 小时</span></div>
          <div class="panel-body">
            <canvas id="metricChart" height="180"></canvas>
            <div class="legend">
              <span class="dot t"></span>任务吞吐
              <span class="dot c"></span>CPU %
              <span class="dot m"></span>内存 MB
            </div>
          </div>
        </div>

        <div class="panel logs">
          <div class="panel-head"><h2>实时日志</h2><span class="hint" id="logCount"></span></div>
          <div class="panel-body" id="logList"></div>
        </div>
      </section>
    </div>

    <!-- ===== 系统运维 ===== -->
    <div id="view-ops" class="view hidden">
      <section class="cards" id="opsCards"></section>
      <section class="ops-grid">
        <div class="panel">
          <div class="panel-head"><h2>核心服务控制</h2></div>
          <div class="panel-body">
            <div id="coreStatusBox" class="core-box"></div>
            <div class="ops-buttons">
              <button id="startBtn" class="btn primary">启动</button>
              <button id="stopBtn" class="btn">停止</button>
              <button id="restartBtn" class="btn">重启</button>
            </div>
            <p class="hint">管理 Hermes Agent 核心服务生命周期。停止后任务调度将暂停，重启会重置运行计时。</p>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2>环境自检</h2><button id="checkBtn" class="btn">立即检查</button></div>
          <div class="panel-body" id="checkList"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>运维日志</h2></div>
        <div class="panel-body" id="opsLog"></div>
      </section>
    </div>

    <!-- ===== 设置 ===== -->
    <div id="view-settings" class="view hidden">
      <section class="settings-grid">
        <div class="panel">
          <div class="panel-head"><h2>模型密钥设置</h2></div>
          <div class="panel-body">
            <label>服务商</label>
            <select id="modelProvider">
              <option value="openai">OpenAI</option>
              <option value="anthropic">Anthropic</option>
              <option value="deepseek">深度求索 DeepSeek</option>
              <option value="qwen">阿里通义千问</option>
              <option value="custom">自定义</option>
            </select>
            <label>API Key <span class="hint" id="keyHint"></span></label>
            <input id="modelKey" type="password" placeholder="留空表示不修改" autocomplete="off">
            <label>Base URL</label>
            <input id="modelBaseURL" type="text" placeholder="https://api.openai.com/v1">
            <label>模型名称</label>
            <input id="modelName" type="text" placeholder="hermes-3-llama-3.1-70b">
            <button id="saveModelBtn" class="btn primary">保存模型设置</button>
            <p class="hint">密钥仅保存在本面板所在沙箱的 data/settings.json，不会外传。</p>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2>微信接入设置</h2></div>
          <div class="panel-body">
            <label class="switch-row">
              <span>启用微信接入</span>
              <label class="switch">
                <input type="checkbox" id="wxEnabled">
                <span class="slider"></span>
              </label>
            </label>
            <label>Token</label>
            <input id="wxToken" type="password" placeholder="公众号 Token（留空不修改）" autocomplete="off">
            <label>AppID</label>
            <input id="wxAppId" type="text" placeholder="wx...">
            <label>AppSecret</label>
            <input id="wxAppSecret" type="password" placeholder="留空不修改" autocomplete="off">
            <label>回调 / Webhook 地址</label>
            <input id="wxWebhook" type="text" placeholder="https://your-domain/wechat/callback">
            <button id="saveWxBtn" class="btn primary">保存微信设置</button>
            <p class="hint">启用后，环境自检会校验微信接入配置完整性。</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h3>新建任务</h3>
      <label>任务标题</label>
      <input id="taskTitle" type="text" placeholder="例如：总结本周行业动态" maxlength="60">
      <label>任务类型</label>
      <select id="taskType">
        <option value="research">研究调研</option>
        <option value="report">报告生成</option>
        <option value="devops">运维</option>
        <option value="maintenance">维护</option>
        <option value="custom">自定义</option>
      </select>
      <div class="modal-actions">
        <button id="cancelBtn" class="btn">取消</button>
        <button id="submitBtn" class="btn primary">创建</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
