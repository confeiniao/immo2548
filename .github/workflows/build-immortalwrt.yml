name: Build ImmortalWrt for CT3003

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3 python3-distutils

    - name: Clone ImmortalWrt source
      run: |
        git clone https://github.com/hanwckf/immortalwrt-mt798x.git immortalwrt
        cd immortalwrt
        git checkout main

    - name: Configure for CT3003
      run: |
        cd immortalwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        cp -f defconfig/mt7981-ax3000.config .config
        make defconfig

    - name: Build ImmortalWrt
      run: |
        cd immortalwrt
        make -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: immortalwrt-ct3003
        path: immortalwrt/bin/targets/mediatek/mt7981/
