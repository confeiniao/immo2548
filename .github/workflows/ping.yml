name: Ping

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 启用 Windows 远程桌面 (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          net user runneradmin MyPassword123!

      - name: 建立 Pinggy TCP 穿透
        run: |
          Write-Host "正在后台建立穿透隧道..."
          # 后台运行 ssh，并将标准输出与错误输出直接写入本地文件
          $proc = Start-Process -FilePath "ssh" -ArgumentList "-p 443 -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o ServerAliveInterval=30 -R0:127.0.0.1:3389 tcp@free.pinggy.io" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log" -PassThru

          # 循环等待输出地址（最多等待 15 秒）
          $found = $false
          for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 1
              if (Test-Path pinggy.log) {
                  $log = Get-Content pinggy.log -Raw
                  if ($log -match "tcp://") {
                      $found = $true
                      break
                  }
              }
          }

          Write-Host "=================== 远程桌面连接信息 ==================="
          if (Test-Path pinggy.log) { Get-Content pinggy.log }
          if (Test-Path pinggy_err.log) { Get-Content pinggy_err.log }
          Write-Host "------------------------------------------------------"
          Write-Host "用户名: runneradmin"
          Write-Host "密码: MyPassword123!"
          Write-Host "======================================================"

          # 保持挂起进程，维持连接不断开
          Wait-Process -Id $proc.Id
